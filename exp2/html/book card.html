<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Store - Product Cards</title>
  
  <!-- Linking External CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f9f9f9; padding: 20px;">

  <h1 style="text-align: center; color: #333;">Featured Farm Books</h1>

  <!-- Book Card 1 -->
  <div class="book-card">
    <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300" alt="Irrigation Guide Book">

    <p>Author: J. Smith</p>

  <!-- Book Card 2 -->
  <div class="book-card">
    <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=300" alt="Soil Science Book">
    <h3>Soil Health Handbook</h3>
    <p>Author: A. Davis</p>
    <p class="price">$19.99</p>
  </div>

  <!-- Book Card 3 -->
  <div class="book-card">
    <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=300" alt="Organic Farming Book">
    <h3>Organic Agriculture</h3>
    <p>Author: M. Taylor</p>
    <p class="price">$29.99</p>
  </div>

</html>
