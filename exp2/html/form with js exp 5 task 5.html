<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farmer Registration Page</title>
  <link rel="stylesheet" href="form.css">

  <!-- nav bar -->
  <style>
    nav ul {
      list-style-type: none; 
      margin: 0;
      padding: 0;
      background-color: #5C8038;
      text-align: center;
    }

    nav ul li {
      display: inline-block;
    }

    nav ul li a {
      display: inline-block;
      color: white;              
      text-decoration: none;    
      padding: 12px 16px;
      font-weight: bold;
    }

    nav ul li a:hover {
      background-color: #3e5824;
      color: lightyellow;       
      text-decoration: underline; 
    }

    /* Style for error message display */
    .error-msg {
      color: red;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>

  <script>
    function calculateAndValidateIrrigation(event) {
      event.preventDefault(); // Prevent standard page refresh

      
      document.getElementById("error-container").innerText = "";
      document.getElementById("report-output").innerHTML = "";

      
      var farmerName = document.getElementById("name").value.trim();
      var mobile = document.getElementById("mobile").value.trim();
      var email = document.getElementById("email").value.trim();
      var plotID = document.getElementById("plotid").value.trim();
      var village = document.getElementById("village").value.trim();
      var cropStage = document.getElementById("cropstage").value.trim();
      var soilType = document.getElementById("soiltype").value.trim();
      var method = document.getElementById("method").value.trim();
      var currentSoilMoisture = parseFloat(document.getElementById("moisture").value);
      var requiredSoilMoisture = parseFloat(document.getElementById("req_moisture").value);
      var irrigationDate = document.getElementById("date").value;
      var photo = document.getElementById("photo").value;



      
      if (!farmerName || !mobile || !email || !plotID || !village || 
          !cropStage || !soilType || !method || isNaN(currentSoilMoisture) || 
          isNaN(requiredSoilMoisture) || !irrigationDate || !photo) {
        showError("Validation Error: Please match the requested format.");
        return false;
      }

      
      var nameRegex = /^[A-Za-z\s]+$/;
      if (!nameRegex.test(farmerName)) {
        showError("Validation Error: Please match the requested format.");
        return false;
      }
      var mobileRegex = /^\d{10}$/;
      if (!mobileRegex.test(mobile)) {
        showError("Validation Error: Please match the requested format.");
        return false;
      }

      
      var plotRegex = /^AGR-\d{4}$/;
      if (!plotRegex.test(plotID)) {
        showError("Validation Error: Please match the requested format.");
        return false;
      }

      
      if (currentSoilMoisture < 0 || currentSoilMoisture > 100) {
        showError("Validation Error: Please match the requested format.");
        return false;
      }

      if (requiredSoilMoisture < 0 || requiredSoilMoisture > 100) {
        showError("Validation Error: Required Soil Moisture must be between 0 and 100.");
        return false;
      }


      var moistureDeficit = requiredSoilMoisture - currentSoilMoisture;
      var statusMessage = "";

      if (moistureDeficit > 0) {
        statusMessage = "Irrigation Needed! Water Deficit: " + moistureDeficit.toFixed(1) + "%";
      } else {
        statusMessage = "Sufficient Soil Moisture. No Irrigation Required. Surplus/Balance: " + Math.abs(moistureDeficit).toFixed(1) + "%";
      }

      /* Alert pop-up */
      alert("Validation Successful! \n\nFarmer: " + farmerName + "\nPlot ID: " + plotID + "\nStatus: " + statusMessage);

      
      var reportHTML = `
        <div style="background-color: #ffffff; border: 2px solid #5C8038; width: 60%; margin: 20px auto; padding: 20px; border-radius: 8px;">
          <h2 style='text-align:center; font-family:Arial; color:#5C8038;'>Irrigation Status Report</h2>
          <hr>
          <div style='font-size:16px; text-align:left; line-height: 1.6;'>
            <p><b>Farmer Name:</b> ${farmerName}</p>
            <p><b>Mobile:</b> ${mobile}</p>
            <p><b>Plot ID:</b> ${plotID}</p>
            <p><b>Crop Stage:</b> ${cropStage}</p>
            <p><b>Irrigation Date:</b> ${irrigationDate}</p>
            <p><b>Current Soil Moisture:</b> ${currentSoilMoisture}%</p>
            <p><b>Required Soil Moisture:</b> ${requiredSoilMoisture}%</p>
            <p><b>Moisture Deficit:</b> ${moistureDeficit.toFixed(1)}%</p>
            <p><b>Status:</b> ${statusMessage}</p>
          </div>
        </div>
      `;

      document.getElementById("report-output").innerHTML = reportHTML;
      return true;
    }

    function showError(msg) {
      document.getElementById("error-container").innerText = msg;
    }
  </script>
</head>

<body style="background-color:lightyellow">

  <h1 style="text-align:center">Registration Page</h1>

  <nav>
    <table style="width:100%">
      <tr style="background-color:#5C8038">
        <th><a href="index.html" style="color:white">Home</a></th>
        <th><a href="registration.html" style="color:white">Register</a></th>
        <th><a href="farm-info.html" style="color:white">Farm Dashboard</a></th>
        <th><a href="advisory.html" style="color:white">Irrigation Advisory</a></th>
        <th><a href="irrigation-table.html" style="color:white">Sensor Data</a></th>
        <th><a href="weather.html" style="color:white">Weather Forecast</a></th>
        <th><a href="contact.html" style="color:white">Contact</a></th>
        <th><a href="gallery.html" style="color:white">Gallery</a></th>
        <th><a href="plot-map.html" style="color:white">Plot Map</a></th>
        <th><a href="media.html" style="color:white">Media</a></th>
      </tr>
    </table>
  </nav>

  <br>
  <hr>
  <br>

  <center>
    <h2><b>Farmer Registration Form</b></h2>

    <!-- Error container for validation feedback -->
    <div id="error-container" class="error-msg"></div>

    <form onsubmit="calculateAndValidateIrrigation(event)">
      <fieldset style="width:400px; text-align: left; padding: 20px;">
        
        <label for="name">Name(*):</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required autofocus style="width: 100%;">
        <br><br>

        <label for="mobile">Mobile Number (*):</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="10 digit mobile number" pattern="[0-9]{10}" required style="width: 100%;">
        <br><br>

        <label for="email">Email (*):</label><br>
        <input type="email" id="email" name="email" placeholder="Enter email address" required style="width: 100%;">
        <br><br>

        <label for="plotid">Plot ID(*):</label><br>
        <input type="text" id="plotid" name="plotid" placeholder="e.g. AGR-1234" pattern="AGR-[0-9]{4}" required style="width: 100%;">
        <br><br>

        <label for="village">Village(*):</label><br>
        <input type="text" id="village" name="village" placeholder="Enter village name" required style="width: 100%;">
        <br><br>

        <label for="cropstage">Crop Stage(*):</label><br>
        <input type="text" id="cropstage" name="cropstage" placeholder="e.g. Sowing, Flowering" required style="width: 100%;">
        <br><br>

        <label for="soiltype">Soil Type(*):</label><br>
        <input type="text" id="soiltype" name="soiltype" placeholder="e.g. Clay, Red, Black" required style="width: 100%;">
        <br><br>

        <label for="method">Irrigation Method (*):</label><br>
        <input type="text" id="method" name="method" placeholder="e.g. Drip, Sprinkler" required style="width: 100%;">
        <br><br>

        <label for="moisture">Current Soil Moisture (%) (0-100) (*):</label><br>
        <input type="number" id="moisture" name="moisture" min="0" max="100" placeholder="e.g. 50" required style="width: 100%;">
        <br><br> 

        <label for="req_moisture">Required Soil Moisture (%) (0-100) (*):</label><br>
        <input type="number" id="req_moisture" name="req_moisture" min="0" max="100" placeholder="e.g. 70" required style="width: 100%;">
        <br><br> 

        <label for="date">Irrigation Date (*):</label><br>
        <input type="date" id="date" name="date" required style="width: 100%;">
        <br><br>

        <label for="photo">Farm Photo(*):</label><br>
        <input type="file" id="photo" name="photo" required style="width: 100%;">
        <br><br>

        <center>
          <input type="submit" value="Register">
          <input type="reset" value="Reset">
        </center>

      </fieldset>
    </form>

    <!-- container where the irrigation report is safely displayed -->
    <div id="report-output"></div>
  </center>

  <br>
  <footer>
    <hr>
    <p style="text-align: center">All copyrights are reserved by Tanb</p>
  </footer>

</body>
</html>
